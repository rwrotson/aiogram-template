x-app: &app
  image: ${IMAGE_REF:-aiogram-app:dev}
  init: true
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *app
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_HTTP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

